name: Release Helm Chart

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Chart version (e.g., 1.0.0)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: recepgunes1/url-shortener/backend

jobs:
  release:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Chart version will be: ${VERSION}"

      - name: Get latest image for environment
        id: image
        run: |
          ENV="${{ inputs.environment }}"
          PACKAGE_NAME="url-shortener/backend"
          # URL encode the package name (replace / with %2F)
          ENCODED_PACKAGE_NAME=$(echo "$PACKAGE_NAME" | sed 's/\//%2F/g')
          
          echo "Fetching available images for environment: ${ENV}"
          
          # Get all package versions from GitHub Container Registry
          VERSIONS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/${{ github.repository_owner }}/packages/container/${ENCODED_PACKAGE_NAME}/versions")
          
          # Debug: Check if we got valid JSON
          echo "API Response:"
          echo "$VERSIONS" | jq '.' || {
            echo "Error: Invalid JSON response from API"
            echo "Raw response: $VERSIONS"
            exit 1
          }
          
          # Extract tags that match the environment pattern and get the most recent one
          IMAGE_TAG=$(echo "$VERSIONS" | jq -r \
            --arg env "${ENV}" \
            '[.[] | select(.metadata.container.tags[]? | startswith($env + "-")) | 
            {tag: .metadata.container.tags[], created: .created_at}] | 
            sort_by(.created) | reverse | .[0].tag // empty')
          
          if [ -z "$IMAGE_TAG" ]; then
            echo "Error: No image found for environment '${ENV}'"
            echo "Available tags:"
            echo "$VERSIONS" | jq -r '.[].metadata.container.tags[]?' | head -20
            echo "Please build and push an image for this environment first"
            exit 1
          fi
          
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Found image tag: ${IMAGE_TAG}"

      - name: Verify image exists
        run: |
          echo "Verifying image exists..."
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.image_tag }} || {
            echo "Error: Image not found in registry"
            echo "Please build and push the image first using the build-image workflow"
            exit 1
          }

      - name: Update Chart version and values
        run: |
          CHART_VERSION="${{ steps.version.outputs.version }}"
          IMAGE_TAG="${{ steps.image.outputs.image_tag }}"
          
          echo "Updating Chart.yaml version to ${CHART_VERSION}"
          echo "Updating values.yaml image tag to ${IMAGE_TAG}"
          
          # Update Chart.yaml version
          sed -i "s/^version:.*/version: ${CHART_VERSION}/" charts/url-shortener/Chart.yaml
          
          # Update values.yaml with image repository and tag
          sed -i "s|repository:.*|repository: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}|" charts/url-shortener/values.yaml
          sed -i 's/tag: ".*"/tag: "'"${IMAGE_TAG}"'"/' charts/url-shortener/values.yaml
          
          # Show the changes
          echo "=== Chart.yaml ===" 
          cat charts/url-shortener/Chart.yaml
          echo ""
          echo "=== values.yaml (image section) ==="
          grep -A 3 "^image:" charts/url-shortener/values.yaml

      - name: Commit changes
        run: |
          git add charts/url-shortener/Chart.yaml charts/url-shortener/values.yaml
          git commit -m "Release chart version ${{ steps.version.outputs.version }} for ${{ inputs.environment }}" || {
            echo "No changes to commit"
          }

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: charts
          config: .github/cr-config.yaml
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Release summary
        run: |
          echo "### Helm Chart Released Successfully! :package:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Chart Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** ${{ steps.image.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Full Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
